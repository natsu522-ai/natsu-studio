<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paramètres — Natsu Studio</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><img src="favicon.svg" alt=""> Natsu Studio</a><nav><a href="index.html">Accueil</a><a href="services.html">Services</a><a href="orders.html">Commander</a><div class="account-menu"><button class="nav-button">👤 Mon compte ▾</button><div class="dropdown"><a href="account.html">👤 Mon compte</a><a href="orders.html">📦 Mes commandes</a><a href="settings.html">⚙️ Paramètres</a></div></div></nav></header>
<main class="settings-layout"><aside class="settings-nav"><h2>⚙️ Paramètres</h2><button class="active" data-tab="security">🔐 Sécurité</button><button data-tab="information">👤 Informations</button><button data-tab="promo">🎟️ Code promo</button></aside>
<section class="settings-content"><div id="security" class="tab active"><h1>🔐 Sécurité</h1><h3>Modifier l'adresse e-mail</h3><p id="emailCooldown"></p><input id="newEmail" type="email" placeholder="Nouvelle adresse e-mail"><button id="changeEmail" class="btn primary">Demander le changement</button><hr><h3>Modifier le mot de passe</h3><label>Ancien mot de passe<input id="oldPassword" type="password"></label><label>Nouveau mot de passe<input id="newPassword" type="password"></label><label>Confirmer le nouveau mot de passe<input id="confirmPassword" type="password"></label><button id="changePassword" class="btn primary">Modifier le mot de passe</button><p id="securityMsg" class="message"></p></div>
<div id="information" class="tab"><h1>👤 Informations</h1><div id="infoBox">Chargement...</div><h3>Nom d'utilisateur</h3><input id="editUsername"><button id="saveUsername" class="btn primary">Enregistrer</button><p id="infoMsg" class="message"></p></div>
<div id="promo" class="tab"><h1>🎟️ Code promo</h1><div class="coming">🚧 Cette fonctionnalité arrive bientôt.</div></div></section></main><script type="module" src="js/settings.js"></script></body></html>
